<path d="M880 206V265" stroke="#80c7ed" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="28" y="270" width="944" height="42" rx="8" fill="#193e56" stroke="#527c97"/><text x="44" y="296" fill="#f0f7fb" font-size="14" font-weight="700">OUTPUT</text><text x="130" y="296" fill="#d7e9f4" font-size="14">Question sheet · Answer key · Offline HTML summary · Saved run state</text><text x="28" y="328" font-size="11" fill="#a9c3d5">Separate calls to the same configured model; computational verification only where supported.</text></g></svg>
