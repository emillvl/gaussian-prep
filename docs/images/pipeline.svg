<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
<title id="title">Five-role Gaussian PREP workflow</title><desc id="desc">Dataset and request enter the planner. Generator, blind verifier and reviewer form a per-item loop. Accepted items enter a whole-paper auditor, followed by export. Failed checks may trigger bounded revisions. All five roles use the same configured model in separate calls.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#80c7ed"/></marker></defs>
<rect width="1000" height="340" rx="16" fill="#0c2236"/><rect x="1" y="1" width="998" height="338" rx="16" fill="none" stroke="#385873"/>
<g font-family="Arial,sans-serif"><text x="28" y="36" font-size="13" font-weight="700" letter-spacing="2" fill="#8bd0f1">THE ASSESSMENT PIPELINE</text><text x="28" y="62" font-size="15" fill="#d5e6f2">Dataset + request + exam/subject</text>
<rect x="213" y="80" width="574" height="145" rx="12" fill="#16354e" stroke="#527c97" stroke-dasharray="5 4"/><text x="500" y="98" text-anchor="middle" font-size="11" letter-spacing="2" fill="#a5d4ec">PER-ITEM LOOP</text>
<g><rect x="28" y="110" width="184" height="96" rx="8" fill="#132e45" stroke="#527c97"/><text x="40" y="131" fill="#91cbe7" font-size="11" font-weight="700">01</text><text x="40" y="153" fill="#f0f7fb" font-size="19" font-weight="700">Planner</text><text x="40" y="174" fill="#d7e9f4" font-size="13">Blueprint</text><text x="40" y="191" fill="#a9c3d5" font-size="12">Request + taxonomy</text></g><g><rect x="218" y="110" width="184" height="96" rx="8" fill="#132e45" stroke="#527c97"/><text x="230" y="131" fill="#91cbe7" font-size="11" font-weight="700">02</text><text x="230" y="153" fill="#f0f7fb" font-size="19" font-weight="700">Generator</text><text x="230" y="174" fill="#d7e9f4" font-size="13">Question</text><text x="230" y="191" fill="#a9c3d5" font-size="12">New or adapted</text></g><g><rect x="408" y="110" width="184" height="96" rx="8" fill="#224d69" stroke="#9ad6f3"/><text x="420" y="131" fill="#91cbe7" font-size="11" font-weight="700">03</text><text x="420" y="153" fill="#f0f7fb" font-size="19" font-weight="700">Verifier</text><text x="420" y="174" fill="#d7e9f4" font-size="13">Blind check</text><text x="420" y="191" fill="#a9c3d5" font-size="12">Math or reasoning</text></g><g><rect x="598" y="110" width="184" height="96" rx="8" fill="#132e45" stroke="#527c97"/><text x="610" y="131" fill="#91cbe7" font-size="11" font-weight="700">04</text><text x="610" y="153" fill="#f0f7fb" font-size="19" font-weight="700">Reviewer</text><text x="610" y="174" fill="#d7e9f4" font-size="13">Item review</text><text x="610" y="191" fill="#a9c3d5" font-size="12">Quality + answer</text></g><g><rect x="788" y="110" width="184" height="96" rx="8" fill="#132e45" stroke="#527c97"/><text x="800" y="131" fill="#91cbe7" font-size="11" font-weight="700">05</text><text x="800" y="153" fill="#f0f7fb" font-size="19" font-weight="700">Auditor</text><text x="800" y="174" fill="#d7e9f4" font-size="13">Whole paper</text><text x="800" y="191" fill="#a9c3d5" font-size="12">Coverage + structure</text></g>
